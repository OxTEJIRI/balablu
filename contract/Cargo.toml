[package]
name = "balablu"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OxTEJIRI/balablu"
description = "BalaBlu: the encyclopedia where every fact has odds"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[workspace]
members = [".", "mock-usdc"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
