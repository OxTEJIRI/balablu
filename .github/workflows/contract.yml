name: contract

on:
  push:
    paths: ["contract/**", ".github/workflows/contract.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contract
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contract
      - name: Unit tests
        run: cargo test --workspace
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm
        run: |
          cargo near build non-reproducible-wasm --no-abi
          cargo near build non-reproducible-wasm --no-abi --manifest-path mock-usdc/Cargo.toml
      - name: Collect wasm
        run: |
          mkdir -p dist
          find target/near -name '*.wasm' -exec cp {} dist/ \;
          ls -la dist
          (cd dist && sha256sum *.wasm | tee SHA256SUMS)
          echo "${GITHUB_SHA}" > dist/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: balablu-wasm
          path: contract/dist/
      - name: Publish wasm to the contract-latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: contract-latest
          name: Contract build (latest main)
          prerelease: true
          make_latest: false
          files: |
            contract/dist/*.wasm
            contract/dist/SHA256SUMS
            contract/dist/COMMIT
