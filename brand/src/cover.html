.word{font-weight:800;font-size:54px;letter-spacing:-2px}

.bar{height:14px;border-radius:7px;border:3px solid #152E40;background:#FF7A66;overflow:hidden}.bar i{display:block;height:100%;background:#CEFF52}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:700 16px 'JetBrains Mono',monospace}
.stamp{font:800 17px 'Bricolage Grotesque',sans-serif;padding:4px 10px;border-radius:9px;border:3px solid #152E40}
.c1{left:14px;top:46px;transform:rotate(-5deg)}
.c1 .stamp{background:#FF7A66}
.c2{right:14px;top:246px;transform:rotate(5deg)}
